<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TrendCart | Cart</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <div id="site-header"></div>
    <section class="wrap">
        <h2 class="title">Shopping Cart</h2>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Subtotal</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="cartItems"></tbody>
            </table>
        </div>
        <p class="empty" id="emptyCart" hidden>Your cart is empty. <a href="shop.html"><b>Browse the shop</b></a></p>
        <div class="cart-total">
            <h3 id="totalPrice">Total: ₹0</h3><button class="checkout-btn" id="checkout">Proceed to Checkout</button>
        </div>
    </section>
    <div id="site-footer"></div>
    <script src="script.js"></script>
</body>

</html>
