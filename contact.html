<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TrendCart | Contact</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <div id="site-header"></div>
    <section class="contact">
        <h1>Contact Us</h1>
        <form data-msg="Thanks! Your message has been sent."><input type="text" placeholder="Your Name"
                aria-label="Name" required><input type="email" placeholder="Your Email" aria-label="Email"
                required><textarea placeholder="Your Message" rows="6" aria-label="Message" required></textarea><button
                type="submit">Send Message</button></form>
    </section>
    <div id="site-footer"></div>
    <script src="script.js"></script>
</body>

</html>
