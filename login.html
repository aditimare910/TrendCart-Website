<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TrendCart | Login</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <div id="site-header"></div>
    <section class="auth">
        <form data-msg="Login is a demo for now. A backend is needed for real accounts.">
            <h2>Welcome Back!</h2>
            <p>Please login to continue shopping.</p><input type="email" placeholder="Email" aria-label="Email"
                required><input type="password" placeholder="Password" aria-label="Password" required><button
                type="submit">Login</button>
            <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
        </form>
    </section>
    <div id="site-footer"></div>
    <script src="script.js"></script>
</body>

</html>
