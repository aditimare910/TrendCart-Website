<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TrendCart | Sign Up</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <div id="site-header"></div>
    <section class="auth">
        <form data-msg="Account created (demo). A backend is needed for real accounts.">
            <h2>Create Account</h2>
            <p>Join TrendCart and start shopping today.</p><input type="text" placeholder="Full Name"
                aria-label="Full name" required><input type="email" placeholder="Email Address" aria-label="Email"
                required><input type="password" placeholder="Create Password" aria-label="Password" required><input
                type="password" placeholder="Confirm Password" aria-label="Confirm password" required><button
                type="submit">Sign Up</button>
            <p>Already have an account? <a href="login.html">Login</a></p>
        </form>
    </section>
    <div id="site-footer"></div>
    <script src="script.js"></script>
</body>

</html>
